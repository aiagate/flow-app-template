name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files="$(gofmt -s -l .)"
          if [ -n "$files" ]; then
            printf 'gofmt required for:\n%s\n' "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./...

      - name: Test without CGO
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/flow-api ./cmd/server && ls -lh /tmp/flow-api && rm -f /tmp/flow-api

      - name: Validate restore script
        run: bash -n deploy/litestream/restore.sh && test -x deploy/litestream/restore.sh
