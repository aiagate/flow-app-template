name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bot_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run ruff format check
        run: uv run --frozen --all-extras ruff format --check .

      - name: Run ruff linting
        run: uv run --frozen --all-extras ruff check .

      - name: Run type checking with pyright
        run: uv run --frozen --all-extras pyright

      - name: Run tests with SQLite
        env:
          TEST_DATABASE_URL: sqlite+aiosqlite://
        run: uv run --frozen --all-extras pytest --cov --cov-report=term-missing

      - name: Run tests with PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bot_test
        run: uv run --frozen --all-extras pytest --cov --cov-report=term-missing

  optional-extras:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install all entry-point extras
        run: uv sync --frozen --all-extras

      - name: Verify isolated core and entry-point environments
        env:
          FLOW_APP_OPTIONAL_EXTRAS_INTEGRATION: "1"
        run: >-
          uv run --frozen --all-extras pytest
          tests/tooling/test_optional_dependencies.py
          -p no:cacheprovider --no-cov
